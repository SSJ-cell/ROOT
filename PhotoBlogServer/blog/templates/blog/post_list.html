<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Photo blog</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .page-header { 
            background-color: #ff9400;
            padding: 20px 30px; 
            color: white; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .page-header h1 { 
            margin: 0; font-size: 40px; font-style: italic; font-weight: bold; 
        }
        .page-header .plus-icon { 
            font-size: 50px; font-weight: bold; color: white; text-decoration: none; 
        }
        .content { padding: 30px; }
        .post { margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .post .date { color: #888; font-size: 14px; margin-bottom: 10px; }
        .post h2 { margin: 0 0 15px 0; font-size: 32px; font-weight: bold; color: #000; }
        .post img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <header class="page-header">
        <h1>Photo blog</h1>
        <a href="#" class="plus-icon">+</a>
    </header>
    
    <div class="content">
        {% for post in posts %}
            <div class="post">
                <div class="date">{{ post.created_date|date:"Y년 m월 d일 g:i A" }}</div>
                <h2>{{ post.title }}</h2>
                <p>{{ post.text }}</p>
                {% if post.image %}
                    <img src="{{ post.image.url }}" alt="블로그 이미지">
                {% endif %}
            </div>
        {% endfor %}
    </div>
</body>
</html>
